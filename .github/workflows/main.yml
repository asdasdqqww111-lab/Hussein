name: Windows 11 - Tailscale - SSH - RDP

on:
  workflow_dispatch:

jobs:
  secure-windows:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Windows RDP User
        shell: pwsh
        env:
          WINDOWS_RDP_PASSWORD: ${{ secrets.WINDOWS_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_RDP_PASSWORD) -or $env:WINDOWS_RDP_PASSWORD.Length -lt 12) {
            throw "Windows password secret is missing or too short."
          }

          $securePass = ConvertTo-SecureString $env:WINDOWS_RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name "RDP" -Password $securePass -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name "RDP" -Password $securePass -PasswordNeverExpires $true
            Enable-LocalUser -Name "RDP"
          }

          foreach ($group in @("Administrators", "Remote Desktop Users")) {
            $members = Get-LocalGroupMember -Group $group
            if (-not ($members | Where-Object { $_.Name -match '\\RDP$' })) {
              Add-LocalGroupMember -Group $group -Member "RDP"
            }
          }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name SecurityLayer -Value 2

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          New-NetFirewallRule -DisplayName "RDP-Tailscale-Only" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Profile Any

          Restart-Service TermService -Force
          Write-Host "RDP user and Tailscale-restricted firewall configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $file
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$file`" /quiet /norestart" -Wait -PassThru
          Remove-Item $file -Force
          if ($p.ExitCode -notin @(0, 3010)) { throw "Tailscale installation failed: $($p.ExitCode)" }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up "--authkey=$env:TAILSCALE_AUTHKEY" "--hostname=gh-runner-$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed." }

          $ip = $null
          for ($i = 0; $i -lt 30 -and -not $ip; $i++) {
            Start-Sleep -Seconds 3
            $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          }

          if (-not $ip) { throw "Tailscale did not assign an IP address." }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale connected: $ip"

      - name: Install and Configure OpenSSH
        shell: pwsh
        env:
          WINDOWS_SSH_PUBLIC_KEY: ${{ secrets.WINDOWS_SSH_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $pub = $env:WINDOWS_SSH_PUBLIC_KEY.Trim()
          if (-not $pub.StartsWith("ssh-ed25519 ")) {
            throw "WINDOWS_SSH_PUBLIC_KEY is missing or invalid."
          }

          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null

          $sshDir = "$env:ProgramData\ssh"
          $keyFile = Join-Path $sshDir "administrators_authorized_keys"
          New-Item -ItemType Directory -Path $sshDir -Force | Out-Null
          Set-Content -Path $keyFile -Value $pub -Encoding ascii

          icacls.exe $keyFile /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"
          if ($LASTEXITCODE -ne 0) { throw "Could not secure SSH authorized keys file." }

          $config = @'
          PubkeyAuthentication yes
          PasswordAuthentication no
          Subsystem sftp sftp-server.exe
          Match Group administrators
              AuthorizedKeysFile __PROGRAMDATA__/ssh/administrators_authorized_keys
          '@

          Set-Content -Path (Join-Path $sshDir "sshd_config") -Value $config -Encoding ascii

          Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          New-NetFirewallRule -DisplayName "SSH-Tailscale-Only" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 22 -RemoteAddress 100.64.0.0/10 -Profile Any

          Set-Service sshd -StartupType Automatic
          Start-Service sshd

          $sshd = "$env:WINDIR\System32\OpenSSH\sshd.exe"
          & $sshd -t
          if ($LASTEXITCODE -ne 0) { throw "OpenSSH configuration validation failed." }

          Restart-Service sshd
          Write-Host "SSH configured for public-key authentication only."

      - name: Install Telegram and 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktop = "C:\Users\Public\Desktop"
          New-Item -ItemType Directory -Path $desktop -Force | Out-Null

          $telegram = Join-Path $env:TEMP "TelegramSetup.exe"
          Invoke-WebRequest "https://telegram.org/dl/desktop/win64" -OutFile $telegram
          if ((Get-Item $telegram).Length -lt 1000000) { throw "Telegram installer download looks invalid." }
          $p = Start-Process $telegram -ArgumentList "/VERYSILENT /NORESTART" -Wait -PassThru
          Remove-Item $telegram -Force
          if ($p.ExitCode -ne 0) { throw "Telegram installation failed: $($p.ExitCode)" }

          $seven = Join-Path $env:TEMP "7zipSetup.exe"
          Invoke-WebRequest "https://www.7-zip.org/a/7z2501-x64.exe" -OutFile $seven
          if ((Get-Item $seven).Length -lt 1000000) { throw "7-Zip installer download looks invalid." }
          $p = Start-Process $seven -ArgumentList "/S" -Wait -PassThru
          Remove-Item $seven -Force
          if ($p.ExitCode -ne 0) { throw "7-Zip installation failed: $($p.ExitCode)" }

          Remove-Item "$desktop\Epic Games Launcher.lnk" -Force -ErrorAction SilentlyContinue
          Remove-Item "$desktop\Unity Hub.lnk" -Force -ErrorAction SilentlyContinue
          Write-Host "Telegram and 7-Zip installation completed."

      - name: Verify SSH and RDP Ports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($port in @(22, 3389)) {
            $ok = $false
            for ($i = 0; $i -lt 10 -and -not $ok; $i++) {
              $ok = (Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port $port -WarningAction SilentlyContinue).TcpTestSucceeded
              if (-not $ok) { Start-Sleep -Seconds 3 }
            }
            if (-not $ok) { throw "Port $port did not pass its local connectivity test." }
            Write-Host "Port $port is listening."
          }

      - name: Apply Wallpaper and Welcome Messages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = "C:\Users\RDP"

          while (-not (Test-Path $profile)) {
            Write-Host "Waiting for the RDP user profile..."
            Start-Sleep -Seconds 20
          }

          $themes = Join-Path $profile "AppData\Roaming\Microsoft\Windows\Themes"
          $cached = Join-Path $themes "CachedFiles"
          New-Item -ItemType Directory -Path $themes -Force | Out-Null
          New-Item -ItemType Directory -Path $cached -Force | Out-Null

          Invoke-WebRequest "https://gitlab.com/gusta7w7/pcrdp-avica/-/raw/main/TranscodedWallpaper" -OutFile (Join-Path $themes "TranscodedWallpaper")
          Invoke-WebRequest "https://gitlab.com/gusta7w7/pcrdp-avica/-/raw/main/CachedImage_1024_768_POS4.jpg" -OutFile (Join-Path $cached "CachedImage_1024_768_POS4.jpg")

          $hours = 6
          for ($i = $hours; $i -gt 1; $i--) {
            & msg.exe RDP "Welcome to your Remote Desktop. You have $i hours remaining."
            Start-Sleep -Seconds 3600
          }

          Start-Sleep -Seconds 1800
          & msg.exe RDP "WARNING: Your Remote Desktop session will close in 15 minutes!"
          Start-Sleep -Seconds 900

      - name: Keep Windows Runner Alive
        shell: pwsh
        run: |
          Write-Host "Windows runner is ready."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "SSH user: RDP"
          Write-Host "RDP user: RDP"
          while ($true) {
            Write-Host "Windows runner active: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
